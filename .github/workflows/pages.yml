name: Publicar la web en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que index.html está al día
        run: |
          set -eu
          sh web/build.sh
          if ! git diff --quiet -- web/src/index.html; then
            echo "::error::web/src/index.html no coincide con sus piezas de web/src/parts/."
            echo "Ejecuta 'sh web/build.sh' y vuelve a hacer commit."
            git diff --stat -- web/src/index.html
            exit 1
          fi
          echo "index.html al día."

      - name: Montar el sitio
        run: |
          set -eu
          mkdir -p _site
          # Una sola página: la web entera está en web/src
          cp -r web/src/. _site/
          # Las piezas de construcción no se publican
          rm -rf _site/parts
          # Sin Jekyll: el sitio es HTML plano
          touch _site/.nojekyll
          echo "— montado —"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
